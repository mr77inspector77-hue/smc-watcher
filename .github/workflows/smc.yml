name: SMC Watcher

on:
  schedule:
    # Yalniz BIST seansinda: hafta ici 07:00-15:59 UTC (10:00-18:59 TSI).
    # Seans disinda kosmak bosuna - hisse verisi zaten degismiyor.
    # GitHub ucretsiz zamanlanmis isleri geciktirir; gercek aralik ~45-60 dk.
    - cron: "*/15 7-15 * * 1-5"
  workflow_dispatch:        # elle calistirma butonu
    inputs:
      test_mesaji:
        description: "Telegram baglantisini test et (durum degismese de mesaj at)"
        type: boolean
        default: false

permissions:
  contents: write           # durum dosyasini geri commit'lemek icin

concurrency:
  group: smc-watcher        # ust uste calismasin
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 12      # 30 hisse x 2 Yahoo istegi; 5 dk yetmiyordu
    env:
      TZ: Europe/Istanbul   # BIST seans kontrolu yerel saate bakiyor
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMC_TEST_MESAJI: ${{ inputs.test_mesaji }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Saat kontrolu
        run: date

      - name: SMC kontrolu
        run: python smc_watch.py

      - name: Durumu kaydet
        run: |
          git config user.name  "smc-watcher"
          git config user.email "actions@github.com"
          git add smc_state_auto.json || true
          if git diff --staged --quiet; then
            echo "degisiklik yok"
          else
            git commit -m "durum guncellendi [skip ci]"
            git push
          fi
